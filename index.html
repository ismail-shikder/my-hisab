<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>আমার হিসাব</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#12201d;--mut:#66756f;--pri:#0f766e;--inc:#15803d;--exp:#c2410c;--bd:#e2e8e5;--bar:#e6ece9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--card:#17211e;--tx:#e8f0ed;--mut:#8fa39b;--pri:#2dd4bf;--inc:#4ade80;--exp:#fb923c;--bd:#26332f;--bar:#26332f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1513;--card:#17211e;--tx:#e8f0ed;--mut:#8fa39b;--pri:#2dd4bf;--inc:#4ade80;--exp:#fb923c;--bd:#26332f;--bar:#26332f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;max-width:560px;margin:auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--bg);border-radius:10px;padding:10px}
.sum small{color:var(--mut);display:block;font-size:12px}
.sum b{font-size:18px}
.big{grid-column:1/3;background:var(--pri)!important;color:#fff}
.big small{color:#d6f5f0}
.sug{grid-column:1/3;border:1px dashed var(--pri);line-height:1.5;font-size:14px}
.big b{font-size:26px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.add{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;margin-top:8px}
.cat{margin:9px 0}
.bar{height:8px;background:var(--bar);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--exp)}
.tx{padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}
.tx small{color:var(--mut)}
.del{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<h1>💰 আমার হিসাব</h1>

<div class="card">
  <div class="row sp"><b>মাস</b><input type="month" id="month" style="width:auto"></div>
  <div class="sum" style="margin-top:10px">
    <div><small>মোট আয় (Income)</small><b class="inc" id="sInc">৳0</b></div>
    <div><small>মোট খরচ (Expense)</small><b class="exp" id="sExp">৳0</b></div>
    <div class="big"><small>অবশিষ্ট (Remaining)</small><b id="sRem">৳0</b></div>
    <div class="sug" id="sug"></div>
  </div>
</div>

<div class="card">
  <div class="tabs"><button id="tExp" class="on">খরচ</button><button id="tInc">আয়</button></div>
  <div style="display:grid;gap:8px">
    <select id="cat"></select>
    <input id="amt" type="number" inputmode="decimal" placeholder="টাকার পরিমাণ (৳)">
    <input id="note" type="text" placeholder="নোট (optional)">
    <input id="date" type="date">
  </div>
  <button class="add" id="addBtn">+ যোগ করো</button>
</div>

<div class="card"><b>খাত অনুযায়ী খরচ</b><div id="cats"></div></div>

<div class="card"><b>সব লেনদেন</b><div id="list"></div></div>

<div class="mut" style="text-align:center">ডেটা তোমার ফোনের browser এ save থাকে।<br>
<a href="#" id="csv" style="color:var(--pri)">CSV download</a></div>

<script>
var EXP=["খাওয়া-দাওয়া","চা-টং","সিগারেট","বাজার","বাসা ভাড়া","বিল (বিদ্যুৎ/গ্যাস/পানি)","মোবাইল ও ইন্টারনেট","যাতায়াত","পড়াশোনা","স্বাস্থ্য/ওষুধ","পরিবার","কেনাকাটা","বিনোদন","দান/সদকা","সঞ্চয়","অন্যান্য"];
var INC=["বেতন","বোনাস","ব্যবসা/সাইড ইনকাম","ফ্রিল্যান্স","উপহার","অন্যান্য"];
var type="exp",tx=[];
function $(i){return document.getElementById(i)}
try{tx=JSON.parse(localStorage.getItem("hisab_tx")||"[]")}catch(e){tx=[]}
function save(){try{localStorage.setItem("hisab_tx",JSON.stringify(tx))}catch(e){}}
function tk(n){return "৳"+Math.round(n).toLocaleString("en-IN")}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
$("month").value=today().slice(0,7);$("date").value=today();
function fillCats(){$("cat").innerHTML=(type=="exp"?EXP:INC).map(function(c){return "<option>"+c+"</option>"}).join("")}
function setType(t){type=t;$("tExp").className=t=="exp"?"on":"";$("tInc").className=t=="inc"?"on":"";fillCats()}
$("tExp").onclick=function(){setType("exp")};$("tInc").onclick=function(){setType("inc")};
$("addBtn").onclick=function(){
  var a=parseFloat($("amt").value);if(!(a>0)){$("amt").focus();return}
  tx.push({id:Date.now(),type:type,cat:$("cat").value,amt:a,note:$("note").value.trim(),date:$("date").value||today()});
  save();$("amt").value="";$("note").value="";
  $("month").value=($("date").value||today()).slice(0,7);render()};
$("month").onchange=render;
function del(id){if(confirm("মুছে ফেলবে?")){tx=tx.filter(function(t){return t.id!==id});save();render()}}
function render(){
  var m=$("month").value;
  var L=tx.filter(function(t){return t.date.slice(0,7)==m}).sort(function(a,b){return a.date<b.date?1:-1});
  var inc=0,exp=0,by={};
  L.forEach(function(t){if(t.type=="inc")inc+=t.amt;else{exp+=t.amt;by[t.cat]=(by[t.cat]||0)+t.amt}});
  $("sInc").textContent=tk(inc);$("sExp").textContent=tk(exp);$("sRem").textContent=tk(inc-exp);
  var sg=$("sug"),now=new Date();
  if(m==today().slice(0,7)){
    var yy=+m.slice(0,4),mm=+m.slice(5,7),dim=new Date(yy,mm,0).getDate(),left=dim-now.getDate(),rem=inc-exp,te=0;
    L.forEach(function(t){if(t.type=="exp"&&t.date==today())te+=t.amt});
    var h="🧾 আজ এখন পর্যন্ত খরচ: <b>"+tk(te)+"</b><br>";
    if(inc==0){h+="আগে এই মাসের আয় যোগ করো, তাহলে কালকের বাজেট বলতে পারব।"}
    else if(left<=0){h+="আজ মাসের শেষ দিন। অবশিষ্ট: <b>"+tk(rem)+"</b>"}
    else if(rem<=0){h+="⚠️ টাকা শেষ বা ঘাটতিতে আছ। কাল থেকে অপ্রয়োজনীয় খরচ (সিগারেট, চা-টং, কেনাকাটা) বন্ধ রাখো।"}
    else{h+="📅 কাল থেকে মাসের বাকি <b>"+left+" দিন</b>, প্রতিদিন সর্বোচ্চ <b>"+tk(rem/left)+"</b> খরচ করলে মাস চলবে।"}
    sg.innerHTML=h;sg.style.display="";
  }else{sg.style.display="none"}
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  $("cats").innerHTML=keys.length?keys.map(function(k){var p=exp?by[k]/exp*100:0;
    return '<div class="cat"><div class="row sp"><span>'+k+'</span><span>'+tk(by[k])+' <small class="mut">('+Math.round(p)+'%)</small></span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join(""):'<p class="mut">এই মাসে কোনো খরচ নেই</p>';
  $("list").innerHTML=L.length?L.map(function(t){
    return '<div class="tx row sp"><div><div>'+t.cat+(t.note?' · <small>'+t.note.replace(/</g,"&lt;")+'</small>':'')+'</div><small>'+t.date+'</small></div><div class="row"><b class="'+t.type+'">'+(t.type=="inc"?"+":"−")+tk(t.amt)+'</b><button class="del" onclick="del('+t.id+')">✕</button></div></div>'}).join(""):'<p class="mut">কোনো লেনদেন নেই</p>';
}
$("csv").onclick=function(e){e.preventDefault();
  var r=["date,type,category,amount,note"].concat(tx.map(function(t){return [t.date,t.type,t.cat,t.amt,'"'+t.note.replace(/"/g,'""')+'"'].join(",")}));
  var w=window.open("","_blank");if(w){w.document.write("<pre>"+r.join("\n")+"</pre>")}};
fillCats();render();
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0){navigator.serviceWorker.register("sw.js")}}catch(e){}
</script>
</body>
</html>
